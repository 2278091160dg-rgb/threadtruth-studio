name: 日系生活感 / Japanese Lifestyle
slug: japanese-lifestyle
version: 0.1.0
maturity: DRAFT                              # 公开权利清单下的真机证据待补

depends_on_core: ">=1.0"

trigger_words: [日系, 日系生活, 日杂, 无印感, 无印风, japanese lifestyle, muji style]
suitable_categories: [连衣裙, 衬衫, 针织, 棉麻, 半裙, 阔腿裤, 衬衫裙, T恤, 大衣]
anti_categories: [婚纱, 比基尼, 礼服, cosplay]

visual_language: >
  Japanese everyday lifestyle editorial, understated muji-like simplicity, warm natural daylight,
  soft diffused window light, gentle documentary candid mood, lived-in calm everyday atmosphere,
  muted earthy neutral palette of oatmeal beige warm white soft brown and faded olive,
  fine film grain texture, realistic native skin texture with no heavy retouching,
  unpretentious natural styling, quiet relaxed warmth, minimalist Japanese interior backdrop.
model_persona: gentle natural ease, soft everyday calm, unguarded relaxed warmth, quiet understated presence, no posed glamour

scenes:
  - 洒满自然光的原木公寓 / 榻榻米房间
  - 安静街角的日系咖啡馆窗边
  - 无印风极简家居(布艺沙发 + 绿植)
  - 清晨住宅区小巷 / 自行车旁
  - 日式杂货店 / 文具店内
  - 米色亚麻背景自然光棚拍
lighting_palette: 自然柔光为主(暖白 / 正午散射),低饱和大地中性(燕麦 / 米 / 原木棕 / 淡橄榄)
pose_masters: inherit
default_mode: C

negative_delta_add: [no high-gloss editorial polish, no heavy retouching, no luxury opulence, no cold studio glare, no influencer glam]
safety_delta:
  cannot_relax: true
  extra_constraints: []

d0_preview: inherit-core
d1_final: inherit-core
d3_prompts: inherit-core
qa_extra: [是否暖调自然光非冷感, 是否日系生活无印底色非高奢, 是否避免重修图/网红感]

samples_required: [preview-grid, look-1..6, README]
evals: repo://evals/styles/japanese-lifestyle.json
