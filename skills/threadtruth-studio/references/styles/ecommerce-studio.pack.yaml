# ecommerce-studio — 电商棚拍风(第三个 pack,验"用途轴/默认棚拍 B")。
name: 电商棚拍 / E-commerce Studio
slug: ecommerce-studio
version: 0.1.0
maturity: DRAFT
depends_on_core: ">=1.0"

trigger_words: [电商主图, 高转化, 淘宝白底, 棚拍主图, 商品主图人像, 详情页人像]
suitable_categories: [上衣, 连衣裙, 裤装, 外套, 针织, 半裙]
anti_categories: [重场景大片, 街拍写真, 旅行写真]

visual_language: >
  clean e-commerce studio portrait, seamless white or light-gray backdrop,
  true-to-product color fidelity, even soft lighting, high-conversion catalog clarity,
  crisp garment detail, minimal distraction, neutral commercial polish.
model_persona: neutral approachable expression, composed catalog attitude, no exaggerated posing

scenes:
  - 纯白无缝背景
  - 浅灰无缝背景
  - 柔光棚拍空间
  - 浅米色纯色背景
  - 低对比影棚
  - 居中柔光位
lighting_palette: even soft-box lighting, neutral white balance, true color, low shadow
pose_masters: inherit
default_mode: B                              # 棚拍(电商主图默认)

negative_delta_add: [no heavy editorial mood, no dramatic shadows hiding product, no busy background, no color cast, no street vibe]
safety_delta:
  cannot_relax: true
  extra_constraints: []

d0_preview: inherit-core
d1_final: inherit-core
d3_prompts: inherit-core
qa_extra: [是否色彩对产品保真, 是否背景纯净低干扰, 是否高转化清晰度]

samples_required: [preview-grid, look-1..6, README]
evals: repo://evals/styles/ecommerce-studio.json
