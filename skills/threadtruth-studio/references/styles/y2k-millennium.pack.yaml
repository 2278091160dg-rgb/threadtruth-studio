# y2k-millennium — 千禧 Y2K 风(v1 静态批量;纯视觉轴)。
name: 千禧 Y2K / Y2K Millennium
slug: y2k-millennium
version: 0.1.0
maturity: DRAFT
depends_on_core: ">=1.0"

trigger_words: [Y2K, 千禧风, 千禧辣妹, 复古千禧, y2k millennium, millennium style]
