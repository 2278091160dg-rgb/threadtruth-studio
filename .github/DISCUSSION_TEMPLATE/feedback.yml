title: "Beta feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: Share opt-in Beta feedback without customer media, private prompts, secrets, or full logs.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0-beta.2
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host, host version and operating system
      placeholder: Codex desktop version / CLI version; OS version (no local paths)
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation result
      options: [pass, fail, not-tested]
    validations:
      required: true
  - type: dropdown
    id: discovery
    attributes:
      label: Explicit Skill discovery result
      options: [pass, fail, not-tested]
    validations:
      required: true
  - type: dropdown
    id: recognition
    attributes:
      label: Recognition-only result after uploading a garment
      options: [pass, fail, not-tested]
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Workflow stage
      options: [installation, discovery, recognition, routing, approval, preview, six-image set, QA, upgrade-or-rollback]
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Sanitized outcome
    validations:
      required: true
  - type: checkboxes
    id: publication
    attributes:
      label: Evidence consent
      options:
        - label: I am not a maintainer of ThreadTruth Studio.
        - label: This sanitized report may be counted in the public Beta register.
